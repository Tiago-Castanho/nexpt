name: Update Comboios Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        run: |
          curl -s "https://servicos.infraestruturasdeportugal.pt/PFP/PFP_Station_Search_Board.aspx?type=2&stationId=9438001" -o raw.json

      - name: Process data safely
        run: |
          node -e "
            const fs = require('fs');

            const raw = fs.readFileSync('raw.json','utf8');

            let json = null;

            try {
              json = JSON.parse(raw);
            } catch (e) {
              console.log('Invalid JSON (blocked or HTML)');
            }

            if (json && json.Nodes) {
              fs.writeFileSync('data/comboios.json', JSON.stringify(json));
              console.log('Updated data');
            } else {
              console.log('Keeping previous data (no overwrite)');
            }
          "

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/comboios.json
          git commit -m "update" || exit 0
          git push