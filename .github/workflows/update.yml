name: Update Comboios Data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch data
        run: |
          curl "https://servicos.infraestruturasdeportugal.pt/PFP/PFP_Station_Search_Board.aspx?type=2&stationId=9438001" -o raw.json

      - name: Save JSON
        run: |
          node -e "
            const fs = require('fs');
            const data = fs.readFileSync('raw.json','utf8');
            try {
              const json = JSON.parse(data);
              fs.writeFileSync('data/comboios.json', JSON.stringify(json));
            } catch(e) {
              console.log('invalid');
            }
          "

      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/comboios.json
          git commit -m "update" || exit 0
          git push